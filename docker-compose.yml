services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DB_ENGINE: ${DB_ENGINE:-sqlite3}
      DB_NAME: ${DB_NAME:-db.sqlite3}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    init: true
    restart: unless-stopped
